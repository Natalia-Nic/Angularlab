<div class="comments-container">
  <h2>💬 Чат комментариев</h2>

  <div class="form-group">
    <label>Имя:</label>
    <input
      type="text"
      [(ngModel)]="username"
      placeholder="Введите имя"
      [attr.title]="'Ваше имя: ' + username"
    />
  </div>

  <div class="form-group">
    <label>Комментарий:</label>
    <textarea
      [(ngModel)]="commentText"
      placeholder="Напишите комментарий..."
      rows="3"
    ></textarea>
  </div>

  <button
    (click)="addComment()"
    [disabled]="inputIsEmpty"
    [class.btn-disabled]="inputIsEmpty"
  >
    Отправить
  </button>

  <div class="comments-list" *ngIf="comments.length > 0; else noComments">
    <h3>Комментарии:</h3>

    <div
      *ngFor="let c of comments; let i = index"
      class="comment"
      [class.new-comment]="i === comments.length - 1"
      [style.borderColor]="c.user === 'Админ' ? 'red' : '#007bff'"
    >
      <strong>{{ c.user }}</strong>
      <span class="time">{{ c.time }}</span>
      <p>{{ c.text }}</p>
    </div>
  </div>

  <ng-template #noComments>
    <p class="no-comments">Пока нет комментариев 😔</p>
  </ng-template>

  <p class="preview">👤 Текущее имя: {{ username }}</p>
</div>
